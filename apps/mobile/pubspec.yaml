name: camerasync_mobile
description: 8kount — record practices from several phones at once and review every angle together.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  video_player: ^2.14.0
  share_plus: ^13.3.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.1
  external_display: ^0.4.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
