# Production stack for 8kount on a single host (SCRUM-52).
#
#   cp deploy/prod.env.example deploy/prod.env   # then edit the values
#   docker compose --env-file deploy/prod.env -f deploy/docker-compose.prod.yml up -d --build
#   docker compose --env-file deploy/prod.env -f deploy/docker-compose.prod.yml run --rm db-init
#
# Differences from the dev docker-compose.yml at the repo root:
#   - no source bind-mounts or hot reload; images are built from the Dockerfiles
#   - the web app is built once (vite build) and served as static files by Caddy
#   - Caddy terminates HTTPS for ${DOMAIN} and proxies API, Socket.IO and timesync to the server
#   - Postgres and the server are NOT exposed on host ports; only Caddy (80/443) is public
#   - recordings go to S3 when prod.env sets S3_BUCKET; otherwise they stay in
#     the uploads volume, which also holds in-flight uploads while they are
#     validated

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ../apps/server
    restart: unless-stopped
    command: ["npm", "start"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      WEB_ORIGIN: https://${DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /data/uploads
    # Storage settings (STORAGE_DRIVER, S3_BUCKET, AWS_*) come straight from
    # prod.env so a key that is not set stays unset for the AWS SDK.
    env_file:
      - ./prod.env
    volumes:
      - uploads:/data/uploads
    expose:
      - "4000"

  caddy:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
      args:
        VITE_SERVER_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # One-off: apply schema.sql. Run explicitly, see header.
  db-init:
    image: postgres:16-alpine
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ../apps/server/src/db/schema.sql:/schema.sql:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql"]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
